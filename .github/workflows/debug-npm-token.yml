name: Debug NPM Token

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Who am I
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: List accessible packages in @helixid scope
        run: npm access list packages @helixid
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check collaborators on each package
        run: |
          for pkg in "@helixid/sdk-js" "@helixid/cli" "@helixid/langchain" "@helixid/mcp-middleware" "@helixid/widget" "@helixid/mcp-server"; do
            echo "=== $pkg ==="
            npm access list collaborators "$pkg" || true
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
